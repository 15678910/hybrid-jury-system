name: 전원합의체 기저율 수집 (수동)

# 수동 실행 전용.
#
# 왜 워크플로로 만드는가: 수집기는 law.go.kr(법제처 OPEN API)을 호출하는데,
# 개발 세션 컨테이너에서는 그 도메인이 이그레스 정책으로 차단돼 실행할 수 없다.
# GitHub Actions 러너에서는 열려 있으므로 여기서 돌린다.
#
# 인증: LAWAPI_OC 는 법제처 OPEN API 의 이메일 ID 로, 시크릿이 아니다.
#       이미 functions/index.js 에 폴백으로 공개돼 있어 여기서도 그대로 쓴다.
#       (별도 시크릿 등록이 필요 없다)
#
# 결과: 집계 요약을 Job Summary 에 남기고, 원자료를 아티팩트로 올린다.
#       숫자를 확인한 뒤 src/data/predictions.js 의 BASE_RATES 에 옮겨 적는다.
#       ⚠️ 자동으로 커밋하지 않는다. 근거 없는 숫자가 저절로 사이트에 반영되는 것을
#          막기 위해, 사람이 값을 보고 옮기는 단계를 남겨 둔다.

on:
  workflow_dispatch:
    inputs:
      caseType:
        description: '사건종류코드 (400102=형사, 400101=민사)'
        required: true
        default: '400102'
      maxPages:
        description: '목록 최대 페이지 수 (1쪽=100건). 처음에는 5~10 으로 시험할 것'
        required: true
        default: '10'
      compare:
        description: '소부 비교군도 수집해 보정계수를 산출할지'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 파서 검증
        # 파서가 깨진 채로 수집하면 잘못된 집계가 나온다. 먼저 확인한다.
        run: node functions/lib/precedent_parser.test.cjs

      - name: law.go.kr 도달 여부 진단
        id: reach
        # 수집이 실패했을 때 원인이 네트워크인지 아닌지 먼저 가린다.
        # 한국 정부 사이트는 해외 IP 를 차단하는 경우가 있고, GitHub 러너는 해외에 있다.
        continue-on-error: true
        run: |
          echo "러너 위치(대략):"
          curl -s --max-time 10 https://ipinfo.io/json | head -20 || echo "  (ipinfo 조회 실패)"
          echo ""
          echo "law.go.kr DNS:"
          getent hosts www.law.go.kr || echo "  ❌ DNS 해석 실패"
          echo ""
          echo "law.go.kr HTTPS 응답:"
          # 이 서버는 첫 연결에만 10초 안팎이 걸린다. 짧게 끊으면 살아 있는 서버를
          # 죽은 것으로 오진한다. 실제로 20초 제한에서 한 번은 200, 한 번은 timeout 이었다.
          CODE=$(curl -sS -o /dev/null --max-time 60 -w "%{http_code}" \
            "https://www.law.go.kr/DRF/lawSearch.do?OC=${LAWAPI_OC}&target=prec&type=JSON&query=%EC%A0%84%EC%9B%90%ED%95%A9%EC%9D%98%EC%B2%B4&display=1" \
            || echo "000")
          echo "  HTTP $CODE"
          if [ "$CODE" = "200" ]; then
            echo "reachable=도달 (HTTP 200)" >> $GITHUB_OUTPUT
          else
            echo "reachable=도달 불가 (HTTP $CODE)" >> $GITHUB_OUTPUT
            echo "  ❌ 연결 실패 — 이 상태면 아래 단계들도 모두 실패한다"
          fi
        env:
          LAWAPI_OC: ${{ vars.LAWAPI_OC || 'lacoiffure828' }}

      # ── 조사를 수집보다 먼저 돌린다 ──────────────────────────────
      # 앞서 수집이 실패하자 이 단계가 통째로 skip 됐다. continue-on-error 는
      # 그 단계 자신의 실패만 무시할 뿐, 앞 단계가 실패하면 뒤 단계는 건너뛴다.
      # 조사는 수집과 독립된 일이므로 수집에 묶여 있을 이유가 없다.
      #
      # 순서도 바꿨다. 조사는 3쪽 + 상세 6건으로 가벼워, law.go.kr 이 느릴 때
      # 성공할 가능성이 더 크다. 무거운 수집이 연결을 다 쓰고 실패한 뒤에
      # 시도하게 두면 될 일도 안 된다.
      - name: 파기 방향 문언 조사
        id: probe
        # 파기가 피고인 상고를 받아들인 것인지 검사 상고를 받아들인 것인지 가리려면
        # 판결문의 실제 표현을 알아야 한다. 보지 않은 문장에 정규식을 짜면 규칙이
        # 아니라 추측이다. 그래서 문언을 먼저 떠서 로그에 남긴다.
        #
        # ⚠️ continue-on-error 를 쓰지 않는다. 그것을 붙이면 스크립트가 죽어도
        #    단계 결론이 success 로 표시되어, 로그를 열기 전에는 실패를 알 수 없다.
        #    실제로 그 표시를 믿고 「조사 성공」이라고 잘못 보고한 적이 있다.
        #    대신 실패를 직접 붙잡아 결과를 출력으로 남기고, 뒤 단계는 if: always() 로 이어간다.
        env:
          LAWAPI_OC: ${{ vars.LAWAPI_OC || 'lacoiffure828' }}
        working-directory: functions
        # 빨리 실패하게 둔다. 오래 매달려 봐야 뒤의 수집 시간만 잡아먹는다.
        run: |
          if node probe_reversal_direction.cjs \
                --caseType ${{ github.event.inputs.caseType }} \
                --samples 6 --maxPages 3 --timeout 30000; then
            echo "result=성공" >> $GITHUB_OUTPUT
          else
            echo "result=실패" >> $GITHUB_OUTPUT
            echo "::warning::파기 방향 문언 조사 실패 — 위 로그의 오류 메시지를 확인할 것"
          fi

      - name: 기저율 수집
        # 조사가 실패해도 수집은 시도한다. 둘은 독립된 일이다.
        if: always()
        env:
          LAWAPI_OC: ${{ vars.LAWAPI_OC || 'lacoiffure828' }}
        working-directory: functions
        run: |
          # pipefail 이 없으면 파이프라인의 종료 코드가 마지막 명령(tee)의 것이 되어
          # 수집기가 exit 1 로 죽어도 이 단계가 성공으로 처리된다. 실제로 그렇게
          # 「0건 수집」이 success 로 보고된 적이 있다. 실패가 성공으로 보이면
          # 로그를 읽기 전까지 아무도 알 수 없다.
          set -o pipefail
          ARGS="--caseType ${{ github.event.inputs.caseType }} --maxPages ${{ github.event.inputs.maxPages }} --delay 300 --timeout 60000"
          if [ "${{ github.event.inputs.compare }}" = "true" ]; then ARGS="$ARGS --compare"; fi
          echo "실행: node collect_enbanc_precedents.cjs $ARGS"
          node collect_enbanc_precedents.cjs $ARGS 2>&1 | tee ../collect_output.txt

      - name: 집계 요약을 Job Summary 에 기록
        if: always()
        run: |
          {
            echo "### 실행 결과 한눈에"
            echo ""
            echo "| 단계 | 결과 |"
            echo "|---|---|"
            echo "| law.go.kr 도달 | ${{ steps.reach.outputs.reachable || '확인 안 됨' }} |"
            echo "| 파기 방향 문언 조사 | ${{ steps.probe.outputs.result || '실행 안 됨' }} |"
            echo ""
            echo "### 전원합의체 기저율 수집 결과"
            echo ""
            echo '```'
            # 진행률 표시(\r)는 걷어내고 집계 부분만 남긴다
            tr '\r' '\n' < collect_output.txt | sed -n '/집계 결과/,$p' | head -40
            echo '```'
            echo ""
            echo "위 숫자를 \`src/data/predictions.js\` 의 \`BASE_RATES\` 에 옮겨 적으면"
            echo "예측 페이지의 「수집 전」 표시가 사라지고 구간이 좁혀집니다."
            echo ""
            echo "⚠️ 표본의 성격(본문에 「전원합의체」가 언급된 판례에서 출발)을 함께 밝힐 것."
          } >> $GITHUB_STEP_SUMMARY

      - name: 원자료 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enbanc-stats-${{ github.run_id }}
          path: |
            docs/stats/enbanc_*.json
            collect_output.txt
          if-no-files-found: warn
          retention-days: 30
