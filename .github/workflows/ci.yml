name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # 레포지토리 Settings > Secrets and variables > Actions 에서
      # TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 를 만들어 두세요.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

      # 판례 파서와 예측 계산은 vitest 밖의 독립 스크립트다.
      # 파서가 깨지면 잘못된 기저율이 집계되고, 예측 계산이 깨지면 같은 사건에
      # 서로 다른 확률이 화면에 나란히 표시된다. 둘 다 조용히 틀리는 종류라 CI 에서 막는다.
      - name: 판례 파서 검증
        run: node functions/lib/precedent_parser.test.cjs

      - name: 예측 계산 검증
        run: node src/lib/predictionMath.test.mjs

      - name: Build project
        run: npm run build

      # ====== 여기서부터 텔레그램 실패 알림 ======
      - name: Notify Telegram on failure
        if: failure() && env.TELEGRAM_CHAT_ID != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          TEXT="🚨 GitHub Actions 빌드/테스트 실패 알림

레포지토리 : ${{ github.repository }}
브랜치     : ${{ github.ref_name }}
워크플로   : ${{ github.workflow }}
잡 ID      : ${{ github.job }}
커밋 SHA   : ${{ github.sha }}
작성자     : ${{ github.actor }}

로그 보기:
https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}"
