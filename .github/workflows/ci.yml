name: CI

on:
  # 작업은 대부분 claude/** 브랜치에서 이뤄지는데 여기서 검사가 돌지 않으면
  # 파서·예측 계산이 깨진 채로 main 까지 올라간다. 그래서 작업 브랜치도 포함한다.
  push:
    branches: [ main, dev, 'claude/**' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # 레포지토리 Settings > Secrets and variables > Actions 에서
      # TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 를 만들어 두세요.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

      # 판례 파서와 예측 계산은 vitest 밖의 독립 스크립트다.
      # 파서가 깨지면 잘못된 기저율이 집계되고, 예측 계산이 깨지면 같은 사건에
      # 서로 다른 확률이 화면에 나란히 표시된다. 둘 다 조용히 틀리는 종류라 CI 에서 막는다.
      - name: 판례 파서 검증
        run: node functions/lib/precedent_parser.test.cjs

      - name: 예측 계산 검증
        run: node src/lib/predictionMath.test.mjs

      - name: Build project
        run: npm run build

      # ====== 여기서부터 텔레그램 실패 알림 ======
      # 본문 각 줄은 반드시 `run: |` 블록보다 들여써야 한다. 예전에는 메시지 줄이
      # 1열에서 시작해 YAML 블록이 거기서 끊겼고, 워크플로 자체가 파싱되지 않아
      # 모든 실행이 startup_failure 로 끝났다(= 테스트가 한 번도 돌지 않았다).
      # 그래서 줄바꿈은 들여쓰기를 건드리지 않는 printf 로 만든다.
      - name: Notify Telegram on failure
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
          JOB_ID: ${{ github.job }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT=$(printf '%s\n' \
            "🚨 GitHub Actions 빌드/테스트 실패 알림" \
            "" \
            "레포지토리 : ${REPO}" \
            "브랜치     : ${BRANCH}" \
            "워크플로   : ${WORKFLOW_NAME}" \
            "잡 ID      : ${JOB_ID}" \
            "커밋 SHA   : ${COMMIT_SHA}" \
            "작성자     : ${ACTOR}" \
            "" \
            "로그 보기:" \
            "${RUN_URL}")

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}"
