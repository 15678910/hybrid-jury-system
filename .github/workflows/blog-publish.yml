name: 블로그 글 게시 (수동)

# 수동 실행 전용이다. 버튼을 누르는 것이 곧 게시 승인이다(호스팅 배포·인스타 게시와 같은 원칙).
# 원격 세션에는 서비스 계정 키가 없어 Firestore 에 글을 쓸 수 없으므로 이 워크플로가 대신한다.
#
# 쓰는 법: Actions → 「블로그 글 게시 (수동)」 → Run workflow
#   spec    : 게시 명세 JSON (예: docs/columns/publish/2026-10-01_권력이_흉기가_된_사회.json)
#   confirm : «게시» 라고 입력
#
# 순서: Firestore 전체 백업(아티팩트로 보관) → 표지 Storage 업로드 → posts 에 새 글 추가.
# 신규 생성만 한다. 같은 제목의 글이 있으면 건너뛴다. 삭제·수정은 하지 않는다.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: '게시 명세 JSON 경로 (예: docs/columns/publish/2026-10-01_권력이_흉기가_된_사회.json)'
        required: true
        default: ''
      confirm:
        description: '게시를 확인하려면 "게시"라고 입력하세요'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: blog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 확인 문구 검사
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "게시" ]; then
            echo "::error::확인 문구가 «게시» 가 아닙니다. 실수로 눌린 실행을 막습니다."
            exit 1
          fi

      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 함수 의존성 설치
        run: |
          cd functions
          npm install

      - name: 서비스 계정 키 파일
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          printenv SA_KEY > serviceAccountKey.json

      - name: Firestore 백업 (쓰기 전 필수)
        run: |
          cd functions
          node backup_firestore_ci.js

      - name: 백업 보관
        uses: actions/upload-artifact@v4
        with:
          name: firestore-backup-before-blog-publish-${{ github.run_id }}
          path: backups/
          retention-days: 30

      - name: 블로그 글 생성
        env:
          SPEC: ${{ github.event.inputs.spec }}
        run: node functions/create_blog_post_ci.cjs "$SPEC"

      - name: 키 파일 삭제
        if: always()
        run: rm -f serviceAccountKey.json
