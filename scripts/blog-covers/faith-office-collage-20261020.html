<!doctype html><html lang="ko"><head><meta charset="utf-8">
<!-- 칼럼 「주권이 왜 백악관 신앙사무국을 거치는가」(2026.10.20) 블로그 표지. 1200×900, 콜라주(종이 오려 붙이기) 화법.
     실존 인물은 그리지 않는다 — 건물·십자가·열쇠·서명·찢은 종이 조각으로만. 목록 카드 16:9 잘림 대비: 제목은 y 120~770 안. -->
<style>
@font-face{font-family:'Pre';src:url('../fonts/Pretendard-Regular.otf');font-weight:400}
@font-face{font-family:'Pre';src:url('../fonts/Pretendard-Bold.otf');font-weight:700}
@font-face{font-family:'BHS';src:url('../fonts/blackhansans.ttf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:900px;overflow:hidden}
body{background:#E9E2D3;font-family:'Pre',sans-serif;color:#1B1A17;position:relative;word-break:keep-all;
  background-image:radial-gradient(#d8cfbd 1px,transparent 1.2px);background-size:14px 14px}
.paper{position:absolute;box-shadow:3px 4px 0 rgba(0,0,0,.18),0 10px 22px rgba(0,0,0,.14)}
.tape{position:absolute;width:92px;height:26px;background:rgba(255,240,170,.75);transform:rotate(-8deg);
  box-shadow:0 1px 2px rgba(0,0,0,.15);border-left:2px dashed rgba(0,0,0,.08);border-right:2px dashed rgba(0,0,0,.08)}
.strip{position:absolute;padding:8px 16px;font-family:'BHS','Pre',sans-serif;font-size:30px;line-height:1;color:#FFFDF6;background:#1B1A17;
  clip-path:polygon(0 8%,3% 0,97% 4%,100% 12%,99% 90%,96% 100%,4% 96%,0 88%)}
.strip.red{background:#B8261C}
.strip.blue{background:#1F4E9C}
.strip.gold{background:#C9A646;color:#1B1A17}
.cap{position:absolute;font-size:22px;font-weight:700;color:#5A5447;letter-spacing:.04em}
.title{position:absolute;left:64px;top:480px;width:1080px;font-family:'BHS','Pre',sans-serif;font-size:92px;line-height:1.08;color:#1B1A17;letter-spacing:-1px}
.title em{font-style:normal;color:#B8261C}
.title .hl{background:#FFFDF6;box-shadow:0 0 0 6px #FFFDF6;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sub{position:absolute;left:68px;top:700px;width:1070px;font-size:30px;font-weight:700;line-height:1.35;color:#2E2A24}
.foot{position:absolute;left:64px;right:64px;bottom:34px;display:flex;justify-content:space-between;font-size:22px;color:#6B6456}
.foot b{color:#B8261C;font-weight:700}
</style></head><body>

<!-- 왼쪽: 교회(찢은 흰 종이) -->
<svg class="paper" style="left:52px;top:112px;transform:rotate(-4deg)" width="300" height="320" viewBox="0 0 300 320">
  <path d="M6 310 L2 60 L150 8 L296 64 L292 314 Z" fill="#FFFDF6"/>
  <path d="M60 300 L60 160 L150 110 L240 160 L240 300 Z" fill="#2E2A24"/>
  <rect x="140" y="30" width="20" height="90" fill="#B8261C"/><rect x="112" y="52" width="76" height="20" fill="#B8261C"/>
  <path d="M130 300 L130 230 Q150 210 170 230 L170 300 Z" fill="#FFFDF6"/>
  <g transform="rotate(-3 150 150)"><rect x="22" y="134" width="256" height="34" fill="#B8261C"/>
  <text x="150" y="159" text-anchor="middle" font-family="BHS" font-size="20" fill="#FFFDF6" letter-spacing="2">총리 명찰 · 주일예배</text></g>
</svg>
<div class="tape" style="left:150px;top:98px"></div>

<!-- 가운데: 백악관(크림 종이) -->
<svg class="paper" style="left:430px;top:96px;transform:rotate(2deg)" width="360" height="250" viewBox="0 0 360 250">
  <path d="M4 244 L8 6 L354 2 L356 246 Z" fill="#F4EEDD"/>
  <rect x="40" y="110" width="280" height="110" fill="#FFFFFF" stroke="#2E2A24" stroke-width="3"/>
  <path d="M60 110 L180 48 L300 110 Z" fill="#FFFFFF" stroke="#2E2A24" stroke-width="3"/>
  <g stroke="#2E2A24" stroke-width="3"><line x1="90" y1="120" x2="90" y2="210"/><line x1="135" y1="120" x2="135" y2="210"/><line x1="180" y1="120" x2="180" y2="210"/><line x1="225" y1="120" x2="225" y2="210"/><line x1="270" y1="120" x2="270" y2="210"/></g>
  <rect x="30" y="218" width="300" height="10" fill="#2E2A24"/>
  <text x="180" y="40" text-anchor="middle" font-family="BHS" font-size="24" fill="#1F4E9C" letter-spacing="2">WHITE HOUSE · 신앙사무국</text>
</svg>
<div class="tape" style="left:560px;top:84px;transform:rotate(5deg)"></div>

<!-- 오른쪽: 국회 돔(파란 종이) -->
<svg class="paper" style="left:860px;top:124px;transform:rotate(-3deg)" width="290" height="290" viewBox="0 0 290 290">
  <path d="M6 284 L2 8 L286 4 L284 286 Z" fill="#1F4E9C"/>
  <path d="M60 200 L60 150 Q145 60 230 150 L230 200 Z" fill="#9FC3E8"/>
  <rect x="40" y="200" width="210" height="60" fill="#FFFDF6"/>
  <g fill="#1F4E9C"><rect x="60" y="210" width="12" height="40"/><rect x="100" y="210" width="12" height="40"/><rect x="140" y="210" width="12" height="40"/><rect x="180" y="210" width="12" height="40"/><rect x="220" y="210" width="12" height="40"/></g>
  <text x="145" y="40" text-anchor="middle" font-family="BHS" font-size="24" fill="#FFFDF6" letter-spacing="4">국회 · 헌법 제1조</text>
</svg>
<div class="tape" style="left:960px;top:110px;transform:rotate(-12deg)"></div>

<!-- 흐름: 교회 → 백악관 → (국회를 건너뛰는) 점선 화살표 -->
<svg style="position:absolute;left:0;top:0" width="1200" height="900">
  <defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#B8261C"/></marker></defs>
  <path d="M350 250 C 400 200, 420 230, 440 230" fill="none" stroke="#B8261C" stroke-width="6" stroke-dasharray="14 10" marker-end="url(#ah)"/>
  <path d="M790 200 C 830 160, 840 400, 600 440" fill="none" stroke="#B8261C" stroke-width="6" stroke-dasharray="14 10" marker-end="url(#ah)"/>
  <!-- 국회로 가야 할 길은 끊긴 선 -->
  <path d="M860 270 L 820 300" fill="none" stroke="#6B6456" stroke-width="5" stroke-dasharray="4 10"/>
  <line x1="828" y1="282" x2="848" y2="302" stroke="#B8261C" stroke-width="7"/><line x1="848" y1="282" x2="828" y2="302" stroke="#B8261C" stroke-width="7"/>
</svg>

<!-- 오려 붙인 글자 띠 -->
<div class="strip red"  style="left:90px;top:412px;transform:rotate(-6deg)">지지율 33.8%</div>
<div class="strip"      style="left:340px;top:400px;transform:rotate(3deg)">3,500억 달러 서명</div>
<div class="strip gold" style="left:640px;top:404px;transform:rotate(-2deg)">기금 30% 국회 없이</div>
<div class="strip blue" style="left:905px;top:418px;transform:rotate(5deg)">새벽 당대표</div>

<!-- 열쇠(국회가 쥐어야 할) -->
<svg class="paper" style="left:1040px;top:456px;transform:rotate(28deg);box-shadow:none" width="110" height="46" viewBox="0 0 110 46">
  <circle cx="22" cy="23" r="18" fill="none" stroke="#C9A646" stroke-width="9"/>
  <rect x="38" y="18" width="68" height="10" fill="#C9A646"/><rect x="84" y="28" width="8" height="12" fill="#C9A646"/><rect x="98" y="28" width="8" height="12" fill="#C9A646"/>
</svg>

<div class="title">주권이 왜<br><span class="hl"><em>백악관 신앙사무국</em>을 거치는가</span></div>
<div class="sub">김민석의 새벽, 윤호중의 감찰, 그리고 민주당에 들어온 복음주의와 외교</div>
<div class="foot"><span><b>칼럼</b> · 주권자사법개혁추진준비위원회</span><span>시민법정.kr</span></div>
</body></html>
